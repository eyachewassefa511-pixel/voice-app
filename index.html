<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Micro-Agreement</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .record-btn { background: #dc3545; }
        .submit-btn { background: #28a745; }
    </style>
</head>
<body>
    <div class="card">
        <h2>አዲስ የድምፅ ውል መዝግብ</h2>
        <input type="text" id="lender" placeholder="የአበዳሪ ስልክ ቁጥር">
        <input type="text" id="borrower" placeholder="የተበዳሪ ስልክ ቁጥር">
        <input type="number" id="amount" placeholder="የብር መጠን (ETB)">
        <input type="date" id="dueDate">
        
        <button id="recordBtn" class="record-btn" onclick="toggleRecording()">🎤 የድምፅ ውል ይቅረፁ (Start)</button>
        <audio id="audioPreview" controls style="display:none; width:100%; margin-top:10px;"></audio>
        
        <button class="submit-btn" onclick="submitAgreement()">ውሉን መዝግብ እና ላክ</button>
        <p id="status"></p>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.innerText = "🎤 የድምፅ ውል ይቅረፁ (Start)";
                btn.style.background = "#dc3545";
            } else {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audioPreview = document.getElementById('audioPreview');
                    audioPreview.src = audioUrl;
                    audioPreview.style.display = 'block';
                };
                
                mediaRecorder.start();
                btn.innerText = "⏹️ መቅረፁን አቁም (Stop)";
                btn.style.background = "#ffc107";
            }
        }

        async function submitAgreement() {
            if (!audioBlob) {
                alert("እባክዎን መጀመሪያ የድምፅ ውል ይቅረፁ!");
                return;
            }

            const formData = new FormData();
            formData.append('lender_phone', document.getElementById('lender').value);
            formData.append('borrower_phone', document.getElementById('borrower').value);
            formData.append('amount', document.getElementById('amount').value);
            formData.append('due_date', document.getElementById('dueDate').value);
            formData.append('voice_note', audioBlob, 'voice_agreement.wav');

            document.getElementById('status').innerText = "እየተላከ ነው...";

            try {
                const response = await fetch('http://localhost:5000/api/agreements/create', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                document.getElementById('status').innerText = "✅ " + result.message;
            } catch (error) {
                document.getElementById('status').innerText = "❌ ስህተት ተፈጽሟል! ሰርቨሩ መብራቱን ያረጋግጡ።";
            }
        }
    </script>
</body>
</html>
